name: Hermetic verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Show runtime versions
        run: |
          python3 --version
          bash --version | head -1

      - name: Run hermetic suite and executable contracts
        run: make test

      - name: Prove tests did not mutate or create product files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  windows-native:
    # Core transactions execute through real Windows handles. Legacy Bash and
    # POSIX-specific race injection remain in the full Linux/macOS jobs above.
    name: windows-latest / Python ${{ matrix.python }} (native writes)
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash

    steps:
      - name: Disable line-ending translation before checkout
        # The runner image ships autocrlf=true globally; frontmatter parsing
        # and content hashing require byte-exact LF checkouts.  Must run
        # before actions/checkout writes any file.
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Show runtime versions
        run: python --version

      - name: Run native transactions and portable tests
        run: |
          set -eu
          for test_file in \
            tests/test_release_surface.py \
            tests/test_package_validation.py \
            tests/test_knowledge_contracts.py \
            tests/test_knowledge_packs.py \
            tests/test_research_evidence.py \
            tests/test_home_adapter.py \
            tests/test_home_profile.py \
            tests/test_stewardship.py \
            tests/test_stewardship_engine.py \
            tests/test_contracts.py \
            tests/test_benchmark_tools.py \
            tests/test_windows_compat.py \
            tests/test_windows_fs.py \
            tests/test_transaction_windows.py \
            tests/test_transaction_foreign_history.py \
            tests/test_capture_windows.py \
            tests/test_checkpoint_windows.py \
            tests/test_cli_approval.py \
            tests/test_cli_mode.py \
            tests/test_vault_ops.py; do
            echo "=== $test_file ==="
            python "$test_file"
          done

      - name: Run portable validators
        run: |
          python scripts/claude-empire.py package validate
          python scripts/claude-empire.py contracts --check-only

      - name: Prove tests did not mutate or create product files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  release-safety:
    name: Reproducible release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [test, windows-native]
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Build and audit the public artifact twice
        run: |
          python3 scripts/claude-empire.py release build --output "$RUNNER_TEMP/first.zip"
          python3 scripts/claude-empire.py release build --output "$RUNNER_TEMP/second.zip"
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/second.zip"
          python3 scripts/claude-empire.py release audit "$RUNNER_TEMP/first.zip"
